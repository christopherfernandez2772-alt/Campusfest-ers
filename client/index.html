<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusFest - Festival Estudiantil</title>
  <meta name="description" content="CampusFest: sistema web para la gestión del festival estudiantil de la universidad." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <div id="cf-navbar-placeholder"></div>

  <main id="main-content">
    <section class="cf-hero text-center">
      <div class="container">
        <h1 class="display-4">CampusFest 2026</h1>
        <p class="lead">El festival estudiantil que reúne cultura, deporte, tecnología y arte en un solo lugar.</p>
        <div class="row justify-content-center text-start g-3 my-4">
          <div class="col-md-4">
            <p class="mb-1"><i class="bi bi-calendar-event me-2" aria-hidden="true"></i><strong>Fecha del evento:</strong></p>
            <p>10 al 14 de septiembre de 2026</p>
          </div>
          <div class="col-md-4">
            <p class="mb-1"><i class="bi bi-geo-alt me-2" aria-hidden="true"></i><strong>Sede principal:</strong></p>
            <p>Campus Central Universitario</p>
          </div>
        </div>
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
          <a href="/pages/activities.html" class="btn btn-light btn-lg btn-lg-mobile">Ver actividades</a>
          <a href="/pages/registration.html" class="btn btn-outline-light btn-lg btn-lg-mobile">Inscribirme</a>
        </div>
      </div>
    </section>

    <section class="container py-5">
      <h2 class="cf-section-title">Actividades destacadas</h2>
      <div id="featured-activities" class="row g-4">
        <!-- Rendered dynamically via home.js -->
      </div>
    </section>
  </main>

  <div id="cf-footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/toast.js"></script>
  <script src="/components/spinner.js"></script>
  <script src="/components/cards.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
