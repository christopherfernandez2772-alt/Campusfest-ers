<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Administrador - CampusFest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <div id="cf-navbar-placeholder"></div>

  <main id="main-content" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card cf-card">
          <div class="card-body p-4">
            <h1 class="h4 text-center mb-4"><i class="bi bi-shield-lock me-2" aria-hidden="true"></i>Acceso de administrador</h1>
            <form id="admin-login-form" novalidate>
              <label for="adminPassword" class="form-label">Contraseña de administrador</label>
              <input type="password" class="form-control" id="adminPassword" name="adminPassword" required />
              <div class="invalid-feedback"></div>
              <button type="submit" class="btn btn-cf-primary w-100 mt-4" id="admin-login-btn">Ingresar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="cf-footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/toast.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>
