<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscripción - CampusFest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <div id="cf-navbar-placeholder"></div>

  <main id="main-content" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h1 class="cf-section-title">Formulario de inscripción</h1>
        <p class="mb-4">Completa tus datos para inscribirte en una actividad del festival.</p>

        <form id="registration-form" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="fullName" class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="fullName" name="fullName" required />
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label for="identification" class="form-label">Identificación</label>
              <input type="text" class="form-control" id="identification" name="identification" required />
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" name="email" required />
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label for="phone" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="phone" name="phone" required />
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label for="career" class="form-label">Carrera o grupo</label>
              <input type="text" class="form-control" id="career" name="career" required />
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label for="activity" class="form-label">Actividad seleccionada</label>
              <select class="form-select" id="activity" name="activity" required>
                <option value="" selected disabled>Selecciona una actividad</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12">
              <label for="comments" class="form-label">Comentarios</label>
              <textarea class="form-control" id="comments" name="comments" rows="3" placeholder="Escribe aquí cualquier comentario adicional (opcional)"></textarea>
            </div>
          </div>

          <button type="submit" class="btn btn-cf-primary btn-lg mt-4 btn-lg-mobile" id="registration-submit-btn">
            Enviar inscripción
          </button>
        </form>
      </div>
    </div>
  </main>

  <div id="cf-footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/toast.js"></script>
  <script src="/js/registration.js"></script>
</body>
</html>
