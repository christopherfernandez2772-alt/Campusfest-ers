<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actividades - CampusFest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <div id="cf-navbar-placeholder"></div>

  <main id="main-content" class="container py-5">
    <h1 class="cf-section-title">Actividades del festival</h1>

    <form class="row g-3 mb-4" id="activities-filter-form" aria-label="Filtrar actividades">
      <div class="col-sm-6 col-md-4">
        <label for="category-filter" class="form-label">Filtrar por categoría</label>
        <select id="category-filter" class="form-select">
          <option value="">Todas las categorías</option>
          <option value="Cultural">Cultural</option>
          <option value="Deportivo">Deportivo</option>
          <option value="Tecnológico">Tecnológico</option>
          <option value="Artístico">Artístico</option>
          <option value="Gastronómico">Gastronómico</option>
          <option value="Recreativo">Recreativo</option>
        </select>
      </div>
    </form>

    <div id="activities-list" class="row g-4">
      <!-- Rendered dynamically via activities.js -->
    </div>
  </main>

  <div id="cf-footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/toast.js"></script>
  <script src="/components/spinner.js"></script>
  <script src="/components/cards.js"></script>
  <script src="/js/activities.js"></script>
</body>
</html>
