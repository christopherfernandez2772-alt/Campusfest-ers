<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horario del Festival - CampusFest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <div id="cf-navbar-placeholder"></div>

  <main id="main-content" class="container py-5">
    <h1 class="cf-section-title">Horario del festival</h1>
    <p class="mb-4">Consulta todas las actividades ordenadas por fecha y hora.</p>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white rounded shadow-sm">
        <caption class="visually-hidden">Listado de actividades programadas ordenadas por fecha y hora</caption>
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Fecha</th>
            <th scope="col">Hora</th>
            <th scope="col">Lugar</th>
            <th scope="col">Categoría</th>
            <th scope="col">Estado</th>
          </tr>
        </thead>
        <tbody id="schedule-table-body">
          <!-- Rendered dynamically via schedule.js -->
        </tbody>
      </table>
    </div>
    <div id="schedule-empty-state"></div>
  </main>

  <div id="cf-footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/spinner.js"></script>
  <script src="/components/cards.js"></script>
  <script src="/js/schedule.js"></script>
</body>
</html>
